name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check gold-calculator.js
      - run: node --check live-gold.js
      - run: node --check api/gold-price.js
      - run: node --check app.js
      - run: node --test tests/*.test.js
