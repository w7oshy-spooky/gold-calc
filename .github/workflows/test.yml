name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check js/core/price-converter.js
          node --check gold-calculator.js
          node --check live-gold.js
          node --check api/gold-price.js
          node --check js/i18n/translations.js
          node --check js/market/price-cache.js
          node --check js/market/live-price-client.js
          node --check js/ui/formatting.js
          node --check js/ui/market-ui.js
          node --check js/ui/transaction-ui.js
          node --check js/ui/summary-ui.js
          node --check js/ui/share-ui.js
          node --check js/state/preferences-store.js
          node --check js/ui/invoice-ui.js
          node --check js/ui/price-chart-ui.js
          node --check sw.js
          node --check js/app.js
      - run: node --test tests/*.test.js
      - name: Verify tailwind.css matches the classes used in the pages
        run: |
          npx --yes tailwindcss@3.4.17 -c tailwind.config.js -o "$RUNNER_TEMP/tailwind.css" --minify
          diff -q tailwind.css "$RUNNER_TEMP/tailwind.css" || {
            echo "tailwind.css is out of date. Regenerate it with:"
            echo "  npx --yes tailwindcss@3.4.17 -c tailwind.config.js -o tailwind.css --minify"
            exit 1
          }
