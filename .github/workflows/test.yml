name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: node --test tests/*.test.js
      - name: Verify tailwind.css matches the classes used in the pages
        run: |
          npx --yes tailwindcss@3.4.17 -c tailwind.config.js -o "$RUNNER_TEMP/tailwind.css" --minify
          diff -q tailwind.css "$RUNNER_TEMP/tailwind.css" || {
            echo "tailwind.css is out of date. Regenerate it with:"
            echo "  npx --yes tailwindcss@3.4.17 -c tailwind.config.js -o tailwind.css --minify"
            exit 1
          }
