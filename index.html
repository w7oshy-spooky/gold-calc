<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حاسبة الذهب - نسخة الجوال</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        .gradient-bg {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
        }
        .step-btn {
            @apply flex items-center justify-center w-12 h-12 bg-gray-100 active:bg-amber-200 text-gray-700 rounded-lg transition-colors border border-gray-200;
        }
        .input-card {
            @apply bg-white p-4 rounded-xl border border-gray-100 shadow-sm;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-10">

    <!-- Header -->
    <div class="gradient-bg pt-8 pb-12 px-6 text-white text-center rounded-b-[2.5rem] shadow-lg">
        <h1 class="text-2xl font-bold mb-1">حاسبة الذهب الذكية</h1>
        <p class="text-yellow-100 text-sm opacity-90">سهلة وسريعة للاستخدام اليومي</p>
    </div>

    <!-- Main Content -->
    <div class="px-4 -mt-8 space-y-4 max-w-md mx-auto">
        
        <!-- Section: Market Data -->
        <div class="input-card">
            <label class="block text-gray-600 text-xs font-bold mb-2 uppercase tracking-wide">سعر الأوقية (دولار)</label>
            <div class="flex gap-2">
                <div class="relative flex-grow">
                    <input type="number" id="ouncePriceUSD" value="2300" class="w-full bg-blue-50 border-2 border-blue-100 rounded-xl p-3 text-lg font-bold focus:border-blue-400 outline-none transition-all">
                    <span class="absolute left-3 top-3.5 text-blue-400 font-bold">$</span>
                </div>
                <button onclick="convertOunceToGram()" class="bg-blue-600 text-white px-4 rounded-xl active:scale-95 transition-transform">
                    <i class="fa-solid fa-sync"></i>
                </button>
            </div>
            
            <div class="mt-4 pt-4 border-t border-gray-50">
                <label class="block text-gray-600 text-xs font-bold mb-2 uppercase">سعر جرام 24 (ريال)</label>
                <div class="relative">
                    <input type="number" id="marketPrice" value="287.97" class="w-full bg-amber-50 border-2 border-amber-100 rounded-xl p-3 text-lg font-bold text-amber-700 outline-none">
                    <span class="absolute left-3 top-3.5 text-amber-300 font-bold">ر.س</span>
                </div>
            </div>
        </div>

        <!-- Section: Main Specs -->
        <div class="input-card space-y-4">
            <!-- Weight with Steppers -->
            <div>
                <label class="block text-gray-600 text-xs font-bold mb-2">وزن الذهب (جرام)</label>
                <div class="flex items-center gap-2">
                    <button onclick="adjust('weight', -1)" class="step-btn"><i class="fa-solid fa-minus"></i></button>
                    <input type="number" id="weight" value="15" class="flex-grow text-center bg-gray-50 border border-gray-200 rounded-lg p-3 text-xl font-bold">
                    <button onclick="adjust('weight', 1)" class="step-btn"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <!-- Karat Selector -->
            <div>
                <label class="block text-gray-600 text-xs font-bold mb-2">العيار</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setKarat(18)" class="karat-btn p-2 border rounded-lg text-sm font-bold bg-white border-gray-200" data-val="18">18</button>
                    <button onclick="setKarat(21)" class="karat-btn p-2 border rounded-lg text-sm font-bold bg-amber-500 text-white border-amber-500" data-val="21">21</button>
                    <button onclick="setKarat(22)" class="karat-btn p-2 border rounded-lg text-sm font-bold bg-white border-gray-200" data-val="22">22</button>
                    <button onclick="setKarat(24)" class="karat-btn p-2 border rounded-lg text-sm font-bold bg-white border-gray-200" data-val="24">24</button>
                    <input type="hidden" id="karat" value="21">
                </div>
            </div>
        </div>

        <!-- Section: Costs -->
        <div class="input-card space-y-4">
            <div>
                <label class="block text-gray-600 text-xs font-bold mb-2">المصنعية (لكل جرام)</label>
                <div class="flex items-center gap-2">
                    <button onclick="adjust('workmanship', -5)" class="step-btn"><i class="fa-solid fa-minus text-xs"></i>5</button>
                    <input type="number" id="workmanship" value="35" class="flex-grow text-center bg-gray-50 border border-gray-200 rounded-lg p-3 font-bold">
                    <button onclick="adjust('workmanship', 5)" class="step-btn"><i class="fa-solid fa-plus text-xs"></i>5</button>
                </div>
            </div>

            <div>
                <label class="block text-gray-600 text-xs font-bold mb-2">هامش الربح (لكل جرام)</label>
                <div class="flex items-center gap-2">
                    <button onclick="adjust('profit', -1)" class="step-btn"><i class="fa-solid fa-minus"></i></button>
                    <input type="number" id="profit" value="20" class="flex-grow text-center bg-gray-50 border border-gray-200 rounded-lg p-3 font-bold">
                    <button onclick="adjust('profit', 1)" class="step-btn"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
        </div>

        <!-- Section: Tax -->
        <div class="input-card">
            <div class="flex justify-between items-center mb-3">
                <label class="text-gray-600 text-xs font-bold">الضريبة: <span id="taxLabel" class="text-amber-600">15</span>%</label>
            </div>
            <input type="range" id="taxRange" min="0" max="25" value="15" class="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-amber-500">
            <input type="hidden" id="tax" value="15">
        </div>

        <!-- Final Receipt -->
        <div class="bg-slate-800 text-white rounded-2xl p-6 shadow-xl sticky bottom-4 border-t-4 border-amber-500">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <p class="text-slate-400 text-xs mb-1 uppercase tracking-widest font-bold">الإجمالي النهائي</p>
                    <h2 class="text-4xl font-black text-amber-400 font-mono"><span id="finalTotalOutput">0.00</span></h2>
                </div>
                <div class="text-right">
                    <p class="text-slate-400 text-[10px] mb-1">الضريبة المضافة</p>
                    <p class="text-sm font-bold text-red-400"><span id="vatOutput">0.00</span> ر.س</p>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-700 text-[11px] text-slate-300 uppercase">
                <div>الوزن: <span id="summaryWeight" class="text-white font-bold text-xs">15</span>ج</div>
                <div class="text-left">العيار: <span id="summaryKarat" class="text-white font-bold text-xs">21</span></div>
            </div>
        </div>

    </div>

    <script>
        const OUNCE_GRAMS = 31.1034768;
        const USD_SAR_RATE = 3.75;

        const inputs = {
            ouncePriceUSD: document.getElementById('ouncePriceUSD'),
            marketPrice: document.getElementById('marketPrice'),
            weight: document.getElementById('weight'),
            karat: document.getElementById('karat'),
            workmanship: document.getElementById('workmanship'),
            profit: document.getElementById('profit'),
            tax: document.getElementById('tax'),
            taxRange: document.getElementById('taxRange')
        };

        const outputs = {
            vat: document.getElementById('vatOutput'),
            finalTotal: document.getElementById('finalTotalOutput'),
            taxLabel: document.getElementById('taxLabel'),
            summaryWeight: document.getElementById('summaryWeight'),
            summaryKarat: document.getElementById('summaryKarat')
        };

        // دالة الزيادة والنقصان
        function adjust(id, amount) {
            const el = document.getElementById(id);
            let val = parseFloat(el.value) || 0;
            val = Math.max(0, val + amount);
            el.value = id === 'weight' ? val.toFixed(2) : Math.round(val);
            calculate();
        }

        // دالة اختيار العيار
        function setKarat(val) {
            inputs.karat.value = val;
            document.querySelectorAll('.karat-btn').forEach(btn => {
                if(btn.dataset.val == val) {
                    btn.classList.add('bg-amber-500', 'text-white', 'border-amber-500');
                    btn.classList.remove('bg-white', 'border-gray-200');
                } else {
                    btn.classList.remove('bg-amber-500', 'text-white', 'border-amber-500');
                    btn.classList.add('bg-white', 'border-gray-200');
                }
            });
            calculate();
        }

        function convertOunceToGram() {
            const ouncePriceUSD = parseFloat(inputs.ouncePriceUSD.value) || 0;
            if (ouncePriceUSD > 0) {
                const price24KSAR = (ouncePriceUSD / OUNCE_GRAMS) * USD_SAR_RATE;
                inputs.marketPrice.value = price24KSAR.toFixed(2);
                calculate();
            }
        }

        function calculate() {
            const price24k = parseFloat(inputs.marketPrice.value) || 0;
            const weight = parseFloat(inputs.weight.value) || 0;
            const karat = parseFloat(inputs.karat.value);
            const workmanship = parseFloat(inputs.workmanship.value) || 0;
            const profit = parseFloat(inputs.profit.value) || 0;
            const taxRate = parseFloat(inputs.tax.value) || 0;

            const purity = karat / 24;
            const pricePerGramSelectedKarat = price24k * purity;
            const totalGoldCost = pricePerGramSelectedKarat * weight;
            const totalLabor = (workmanship + profit) * weight;
            const subtotal = totalGoldCost + totalLabor;
            const vatValue = subtotal * (taxRate / 100);
            const finalTotal = subtotal + vatValue;

            outputs.vat.textContent = formatNumber(vatValue);
            outputs.finalTotal.textContent = formatNumber(finalTotal);
            outputs.taxLabel.textContent = taxRate;
            outputs.summaryWeight.textContent = weight;
            outputs.summaryKarat.textContent = karat;
        }

        function formatNumber(num) {
            return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        inputs.taxRange.addEventListener('input', (e) => {
            inputs.tax.value = e.target.value;
            calculate();
        });

        Object.values(inputs).forEach(input => {
            input.addEventListener('input', () => {
                if(input.id === 'ouncePriceUSD') convertOunceToGram();
                calculate();
            });
        });

        window.addEventListener('load', () => {
            convertOunceToGram();
            calculate();
        });
    </script>
</body>
</html>
